[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "baraja-mcp"
version = "0.1.2"
description = "Baraja MCP Server - Connect Claude Desktop to Anki via AnkiConnect"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Jim Kroner" }
]
dependencies = [
    "mcp>=0.9.0,<2",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "aiohttp>=3.9.0",
]

[project.scripts]
baraja-mcp-server = "baraja_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/baraja_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
